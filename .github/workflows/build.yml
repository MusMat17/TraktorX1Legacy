name: Build

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  MACOSX_DEPLOYMENT_TARGET: "12.0"
  LIBUSB_VERSION: "1.0.30"
  LIBUSB_SHA256: "fea36f34f9156400209595e300840767ab1a385ede1dc7ee893015aea9c6dbaf"

jobs:
  macos-intel-monterey:
    name: Intel app (macOS 12+)
    runs-on: macos-15-intel

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin
          components: rustfmt

      - name: Build libusb for macOS 12
        shell: bash
        run: |
          set -euo pipefail
          brew install pkg-config || true
          PREFIX="$RUNNER_TEMP/libusb-macos12"
          ARCHIVE="$RUNNER_TEMP/libusb-${LIBUSB_VERSION}.tar.bz2"
          curl -fL             "https://github.com/libusb/libusb/releases/download/v${LIBUSB_VERSION}/libusb-${LIBUSB_VERSION}.tar.bz2"             -o "$ARCHIVE"
          echo "${LIBUSB_SHA256}  $ARCHIVE" | shasum -a 256 -c -
          tar -xjf "$ARCHIVE" -C "$RUNNER_TEMP"
          cd "$RUNNER_TEMP/libusb-${LIBUSB_VERSION}"
          MACOSX_DEPLOYMENT_TARGET="$MACOSX_DEPLOYMENT_TARGET"             ./configure --prefix="$PREFIX" --disable-static --enable-shared
          make -j3
          make install
          echo "PKG_CONFIG_PATH=$PREFIX/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "LIBUSB_PREFIX=$PREFIX" >> "$GITHUB_ENV"

      - name: Verify libusb deployment target
        shell: bash
        run: |
          set -euo pipefail
          LIB="$LIBUSB_PREFIX/lib/libusb-1.0.0.dylib"
          file "$LIB"
          vtool -show-build "$LIB"
          vtool -show-build "$LIB" | grep -Eq "minos[[:space:]]+12(\.0)?"

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Unit tests
        run: cargo test --target x86_64-apple-darwin

      - name: Install WebP decoder
        run: brew install webp

      - name: Build app bundle
        run: chmod +x bundle.sh && ./bundle.sh x86_64-apple-darwin

      - name: Verify packaged app
        shell: bash
        run: |
          set -euo pipefail
          APP="target/x86_64-apple-darwin/release/bundle/osx/TraktorX1Legacy.app"
          BIN="$APP/Contents/MacOS/traktor-x1-legacy"
          LIB="$(find "$APP/Contents/MacOS" -maxdepth 1 -name 'libusb*.dylib' -type f -print -quit)"
          test -n "$LIB"
          file "$BIN"
          file "$BIN" | grep -q "x86_64"
          vtool -show-build "$BIN"
          vtool -show-build "$BIN" | grep -Eq "minos[[:space:]]+12(\.0)?"
          vtool -show-build "$LIB"
          vtool -show-build "$LIB" | grep -Eq "minos[[:space:]]+12(\.0)?"
          otool -L "$BIN"
          otool -L "$BIN" | grep -q "@executable_path/"
          codesign --verify --deep --strict "$APP"
          plutil -lint "$APP/Contents/Info.plist"
          test -s "$APP/Contents/Resources/AppIcon-v012.icns"
          iconutil -c iconset "$APP/Contents/Resources/AppIcon-v012.icns" -o "$RUNNER_TEMP/verified-icon.iconset"
          test -s "$RUNNER_TEMP/verified-icon.iconset/icon_512x512@2x.png"

      - name: Smoke-test ZIP and executable
        shell: bash
        run: |
          set -euo pipefail
          ZIP="dist/TraktorX1Legacy_x86_64-apple-darwin_macos12.0+.zip"
          mkdir -p "$RUNNER_TEMP/unpacked"
          ditto -x -k "$ZIP" "$RUNNER_TEMP/unpacked"
          APP="$RUNNER_TEMP/unpacked/TraktorX1Legacy.app"
          BIN="$APP/Contents/MacOS/traktor-x1-legacy"
          test -x "$BIN"
          test -s "$APP/Contents/Resources/AppIcon-v012.icns"
          codesign --verify --deep --strict "$APP"
          "$BIN" --version | grep -F "TraktorX1Legacy 0.1.2"
          "$BIN" --diagnose

      - name: Prepare companion files
        shell: bash
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/libusb-${LIBUSB_VERSION}.tar.bz2" "dist/libusb-${LIBUSB_VERSION}.tar.bz2"
          cp docs/INSTALL.md dist/INSTALL.md

      - name: Upload test build
        uses: actions/upload-artifact@v4
        with:
          name: TraktorX1Legacy-macOS12-intel
          path: |
            dist/*.zip
            dist/*.tar.bz2
            dist/INSTALL.md
          if-no-files-found: error
